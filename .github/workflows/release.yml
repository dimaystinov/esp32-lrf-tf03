name: Firmware release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arduino CLI and ESP32 core
        shell: bash
        run: |
          set -euo pipefail
          version=1.5.1
          asset="arduino-cli_${version}_Linux_64bit.tar.gz"
          base="https://github.com/arduino/arduino-cli/releases/download/v$version"
          mkdir -p .tools
          cd .tools
          curl -fL --retry 3 "$base/$asset" -o "$asset"
          curl -fL --retry 3 "$base/$version-checksums.txt" -o checksums.txt
          grep " $asset$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" arduino-cli
          echo "$PWD" >> "$GITHUB_PATH"
          ./arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          ./arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Test and build
        run: |
          set -eu
          mkdir -p build
          g++ -std=c++17 -DCONFIG_IDF_TARGET_ESP32C3 -DARDUINO_USB_CDC_ON_BOOT=1 -I tests/stubs tests/runtime_test.cpp -o build/runtime_test
          ./build/runtime_test
          cp firmware/lrf_hf_bridge/Secrets.example.h firmware/lrf_hf_bridge/Secrets.h
          ./build.sh c3
          mkdir -p build/release
          cp build/c3/lrf_hf_bridge.ino.merged.bin build/release/esp32-c3-lidar-bridge-500m.bin
          git archive --format=zip --prefix=esp32-lrf-tf03/ -o build/release/esp32-lrf-tf03-source.zip HEAD
          cp FLASH_IMAGE.md build/release/
          cd build/release
          sha256sum *.bin *.zip FLASH_IMAGE.md > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-release.py
